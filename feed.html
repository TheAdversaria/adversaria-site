<style>
  .mo-desktop { display: block; }
  .mo-mobile { display: none; }
  .mo-modal-overlay { display: none; }

  @media (max-width: 640px) {
    .mo-desktop { display: none; }

    .mo-mobile {
      --bg-app: var(--ink);
      --surface: var(--ink-raised);
      --cream: var(--paper);
      --muted: var(--dust);
      --amber: var(--brass);
      --divider: var(--ink-line);
      display: block;
      font-family: 'Inter', sans-serif;
      background: var(--bg-app);
      min-height: 100vh;
      padding-top: 4px;
    }

    .mo-header { padding: 10px 22px 12px; border-bottom: 1px solid var(--divider); display: flex; align-items: flex-start; justify-content: space-between; }
    .mo-wordmark { font-family: 'Fraunces', serif; font-style: italic; font-weight: 500; font-size: 22px; color: var(--cream); }
    .mo-sub { font-size: 11.5px; color: var(--muted); margin-top: 2px; font-weight: 500; }
    .mo-header-icons { display: flex; gap: 14px; padding-top: 5px; }
    .mo-icon-btn { position: relative; width: 20px; height: 20px; color: var(--cream); display: inline-flex; align-items: center; justify-content: center; }
    .mo-icon-btn svg { width: 100%; height: 100%; display: block; }
    .mo-badge { position: absolute; top: -4px; right: -5px; width: 13px; height: 13px; border-radius: 50%; background: var(--amber); color: #1C1410; font-size: 8px; font-weight: 700; display: flex; align-items: center; justify-content: center; font-family: 'JetBrains Mono', monospace; }

    .mo-toggle-row { display: flex; gap: 20px; padding: 12px 22px 4px; border-bottom: 1px solid var(--divider); }
    .mo-toggle { font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.5px; color: var(--muted); padding-bottom: 10px; position: relative; background: none; border: none; cursor: pointer; }
    .mo-toggle.on { color: var(--cream); font-weight: 600; }
    .mo-toggle.on::after { content: ''; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--amber); border-radius: 2px; }

    .mo-label { padding: 13px 22px 8px; font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); }

    .mo-reels-strip { display: flex; gap: 8px; padding: 0 22px 14px; overflow-x: auto; }
    .mo-reel-card { flex: none; width: 100px; height: 145px; border-radius: 14px; position: relative; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; padding: 8px; background: linear-gradient(200deg, var(--amber), #3a2010 80%); text-decoration: none; }
    .mo-reel-play { position: absolute; top: 9px; right: 9px; width: 19px; height: 19px; border-radius: 50%; background: rgba(0,0,0,0.35); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; }
    .mo-reel-play svg { width: 8px; height: 8px; }
    .mo-reel-name { font-size: 10px; font-weight: 600; color: var(--cream); text-shadow: 0 2px 6px rgba(0,0,0,0.5); }
    .mo-reel-meta { font-family: 'JetBrains Mono', monospace; font-size: 8.5px; color: rgba(243,230,211,0.75); margin-top: 2px; }

    .mo-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; padding: 0 0 90px; }
    .mo-cell { aspect-ratio: 1/1; position: relative; overflow: hidden; background: linear-gradient(160deg, var(--amber), #5C3A22); border: none; padding: 0; cursor: pointer; }
    .mo-cell img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .mo-cell .mo-cell-title { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: 'Fraunces', serif; font-style: italic; color: rgba(243,230,211,0.92); font-size: 11px; text-align: center; padding: 8px; }
    .mo-cell.multi::before { content: ''; position: absolute; top: 6px; right: 6px; width: 15px; height: 15px; background-color: rgba(0,0,0,0.35); border-radius: 3px; background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><rect x="7" y="7" width="14" height="14" rx="2"/><path d="M3 15V5a2 2 0 0 1 2-2h10"/></svg>'); background-size: 10px; background-repeat: no-repeat; background-position: center; }
    .mo-cell.video::after { content: ''; position: absolute; top: 6px; right: 6px; width: 14px; height: 14px; background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="white"><path d="M8 5v14l11-7z"/></svg>'); background-size: contain; background-repeat: no-repeat; filter: drop-shadow(0 1px 2px rgba(0,0,0,0.6)); }

    .mo-empty { padding: 18px 22px; color: var(--muted); font-size: 12.5px; }

    .mo-modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 980; align-items: flex-end; }
    .mo-modal-overlay.is-open { display: flex; }
    .mo-modal { width: 100%; max-height: 88vh; overflow-y: auto; background: var(--bg-app); border-radius: 20px 20px 0 0; padding: 18px 20px 26px; font-family: 'Inter', sans-serif; }
    .mo-modal-close { float: right; background: none; border: none; color: var(--muted); font-size: 20px; cursor: pointer; }
    .mo-modal h3 { font-family: 'Fraunces', serif; font-style: italic; color: var(--cream); font-size: 18px; clear: both; padding-top: 4px; }
    .mo-modal p { color: var(--muted); font-size: 13px; line-height: 1.6; margin-top: 10px; white-space: pre-wrap; }
    .mo-modal-actions { display: flex; gap: 10px; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--divider); }
    .mo-modal-actions button { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; padding: 7px 14px; border-radius: 20px; border: 1px solid var(--amber); background: none; color: var(--amber); cursor: pointer; }
    .mo-modal-comments { margin-top: 14px; }
    .mo-modal-comments input { width: 100%; padding: 9px; margin-top: 8px; background: var(--surface); border: 1px solid var(--divider); color: var(--cream); border-radius: 8px; box-sizing: border-box; font-family: 'Inter', sans-serif; font-size: 12.5px; }
  }
</style>
</head>

<script src="reader.js"></script>
<script>
  var currentUser = null;

  function escapeHtml(s) {
    var d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  function getVideoEmbedUrl(url) {
    if (!url) { return null; }
    var youtubeMatch = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([a-zA-Z0-9_-]{11})/);
    if (youtubeMatch) {
      return 'https://www.youtube.com/embed/' + youtubeMatch[1];
    }
    var vimeoMatch = url.match(/vimeo\.com\/(?:video\/)?(\d+)/);
    if (vimeoMatch) {
      return 'https://player.vimeo.com/video/' + vimeoMatch[1];
    }
    return null;
  }

  function buildVideoHtml(embedUrl, title) {
    var out = '<div style="border-radius: 6px; overflow: hidden; margin-bottom: 12px; background: #000;">';
    out += '<iframe src="' + embedUrl + '" style="width: 100%; aspect-ratio: 16 / 9; border: none; display: block;" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>';
    out += '</div>';
    out += '<h2 style="font-family: var(--display); color: var(--paper); font-size: 1.3rem;">' + escapeHtml(title) + '</h2>';
    return out;
  }

 function buildGalleryHtml(p) {
  var images = [];
  if (p.image_urls && p.image_urls.length > 0) {
    images = p.image_urls;
  } else if (p.image_url) {
    images = [p.image_url];
  }
  if (images.length === 0) { return ''; }

  var out = '<div class="postGallery" data-post-id="' + p.id + '" style="position: relative; border-radius: 6px; overflow: hidden; margin-bottom: 12px; background: var(--ink-raised);">';
  out += '<div class="galleryTrack" style="display: flex; overflow-x: auto; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch;">';
  for (var i = 0; i < images.length; i++) {
    out += '<img src="' + escapeHtml(images[i]) + '" style="flex: none; width: 100%; scroll-snap-align: start; display: block; aspect-ratio: 4 / 3; object-fit: cover;">';
  }
  out += '</div>';
  if (images.length > 1) {
    out += '<button class="galleryPrev" data-post-id="' + p.id + '" aria-label="Previous image" style="position: absolute; left: 8px; top: 50%; transform: translateY(-50%); width: 32px; height: 32px; border-radius: 50%; background: rgba(0,0,0,0.5); color: white; border: none; cursor: pointer; font-size: 1.1rem; line-height: 1;">&#8249;</button>';
    out += '<button class="galleryNext" data-post-id="' + p.id + '" aria-label="Next image" style="position: absolute; right: 8px; top: 50%; transform: translateY(-50%); width: 32px; height: 32px; border-radius: 50%; background: rgba(0,0,0,0.5); color: white; border: none; cursor: pointer; font-size: 1.1rem; line-height: 1;">&#8250;</button>';
    out += '<div class="galleryDots" data-post-id="' + p.id + '" style="position: absolute; bottom: 46px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px;">';
    for (var j = 0; j < images.length; j++) {
      out += '<span class="galleryDot" style="width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,' + (j === 0 ? '0.9' : '0.4') + ');"></span>';
    }
    out += '</div>';
  }
  out += '<div style="position: absolute; bottom: 0; left: 0; right: 0; padding: 16px; background: linear-gradient(transparent, rgba(0,0,0,0.8)); color: white; pointer-events: none;">';
  out += '<h2 style="font-family: var(--display); font-size: 1.3rem; margin: 0;">' + escapeHtml(p.title) + '</h2>';
  out += '</div></div>';
  return out;
}

 function buildArticleHtml(p) {
  var out = '';
  out += '<article style="border-bottom: 1px solid var(--ink-line); padding: 20px 0;" data-post-id="' + p.id + '">';
  var videoEmbedUrl = getVideoEmbedUrl(p.video_url);
  if (videoEmbedUrl) {
    out += buildVideoHtml(videoEmbedUrl, p.title);
  } else {
    var galleryHtml = buildGalleryHtml(p);
    if (galleryHtml) {
      out += galleryHtml;
    } else {
      out += '<h2 style="font-family: var(--display); color: var(--paper); font-size: 1.3rem;">' + escapeHtml(p.title) + '</h2>';
    }
  }
  out += '<a href="profile.html?username=' + encodeURIComponent(p.author_username) + '" style="color: var(--brass); font-size: 0.85rem;">by ' + escapeHtml(p.author_username) + '</a>';
  out += '<p style="color: var(--paper-dim); margin-top: 10px; white-space: pre-wrap;">' + escapeHtml(p.content) + '</p>';
  out += '<div style="margin-top: 12px;">';
  out += '<button class="likeBtn" data-post-id="' + p.id + '" style="background: none; border: 1px solid var(--brass); color: var(--brass); padding: 4px 10px; border-radius: 4px; cursor: pointer; margin-right: 8px;">&#9825; <span class="likeCount">0</span></button>';
  out += '<button class="saveBtn" data-post-id="' + p.id + '" style="background: none; border: 1px solid var(--brass); color: var(--brass); padding: 4px 10px; border-radius: 4px; cursor: pointer; margin-right: 8px;">Save</button>';
  out += '<button class="toggleCommentsBtn" data-post-id="' + p.id + '" style="background: none; border: 1px solid var(--ink-line); color: var(--paper-dim); padding: 4px 10px; border-radius: 4px; cursor: pointer;">Comments</button>';
  out += '</div>';
  out += '<div class="commentsSection" data-post-id="' + p.id + '" style="display: none; margin-top: 12px;">';
  out += '<div class="commentsList" data-post-id="' + p.id + '"></div>';
  out += '<input type="text" class="commentInput" data-post-id="' + p.id + '" placeholder="Write a comment..." style="width: 100%; padding: 8px; margin-top: 8px; background: var(--ink-raised); border: 1px solid var(--ink-line); color: var(--paper); border-radius: 4px; box-sizing: border-box;">';
  out += '</div>';
  out += '</article>';
  return out;
}

  window.currentAscending = false;

  async function loadPosts() {
    var list = document.getElementById('postsList');
    var result = await sb.from('posts').select('*').order('created_at', { ascending: window.currentAscending });
    var posts = result.data;
    var error = result.error;

    if (error) {
      list.innerHTML = '<p style="color: var(--paper-dim);">Could not load posts: ' + error.message + '</p>';
      return;
    }
    if (!posts) {
      list.innerHTML = '<p style="color: var(--paper-dim);">Nothing here yet.</p>';
      renderMobileMoments([]);
      return;
    }
    if (posts.length === 0) {
      list.innerHTML = '<p style="color: var(--paper-dim);">Nothing here yet.</p>';
      renderMobileMoments([]);
      return;
    }
    var html = '';
    for (var i = 0; i < posts.length; i++) {
      html += buildArticleHtml(posts[i]);
    }
    list.innerHTML = html;
    wireUpPostInteractions();
    renderMobileMoments(posts);
  }

  var moFilter = 'all';
  var moPosts = [];

  function hasImage(p) { return (p.image_urls && p.image_urls.length > 0) || p.image_url; }
  function hasVideo(p) { return !!getVideoEmbedUrl(p.video_url); }

  function renderMobileMoments(posts) {
    moPosts = posts || [];
    var sub = document.getElementById('moSub');
    var mediaCount = moPosts.filter(function (p) { return hasImage(p) || hasVideo(p); }).length;
    sub.textContent = mediaCount + (mediaCount === 1 ? ' entry shared' : ' entries shared');

    var reels = moPosts.filter(hasVideo);
    var reelsSection = document.getElementById('moReelsSection');
    var reelsStrip = document.getElementById('moReelsStrip');
    if (reels.length === 0) {
      reelsSection.style.display = 'none';
    } else {
      reelsSection.style.display = 'block';
      var reelsHtml = '';
      reels.slice(0, 8).forEach(function (p) {
        reelsHtml += '<a class="mo-reel-card" data-post-id="' + p.id + '">';
        reelsHtml += '<div class="mo-reel-play"><svg width="8" height="8" viewBox="0 0 24 24" fill="currentColor"><path d="M6 4l14 8-14 8V4z"/></svg></div>';
        reelsHtml += '<div class="mo-reel-name">' + escapeHtml(p.author_username) + '</div>';
        reelsHtml += '<div class="mo-reel-meta">' + escapeHtml(p.title) + '</div>';
        reelsHtml += '</a>';
      });
      reelsStrip.innerHTML = reelsHtml;
    }

    renderMoGrid();
  }

  function renderMoGrid() {
    var grid = document.getElementById('moGrid');
    var items = moPosts.filter(function (p) {
      if (moFilter === 'photos') { return hasImage(p) && !hasVideo(p); }
      if (moFilter === 'reels') { return hasVideo(p); }
      return hasImage(p) || hasVideo(p);
    });

    if (items.length === 0) {
      grid.innerHTML = '<div class="mo-empty">Nothing here yet.</div>';
      return;
    }

    var html = '';
    items.forEach(function (p) {
      var isMulti = p.image_urls && p.image_urls.length > 1;
      var isVideo = hasVideo(p);
      var cls = 'mo-cell' + (isMulti ? ' multi' : '') + (isVideo ? ' video' : '');
      html += '<button type="button" class="' + cls + '" data-post-id="' + p.id + '">';
      if (p.image_url) {
        html += '<img src="' + escapeHtml(p.image_url) + '">';
      } else {
        html += '<span class="mo-cell-title">' + escapeHtml(p.title) + '</span>';
      }
      html += '</button>';
    });
    grid.innerHTML = html;
  }

  document.querySelectorAll('.mo-toggle').forEach(function (btn) {
    btn.addEventListener('click', function () {
      document.querySelectorAll('.mo-toggle').forEach(function (b) { b.classList.remove('on'); });
      this.classList.add('on');
      moFilter = this.dataset.filter;
      renderMoGrid();
    });
  });

  var moCurrentPostId = null;

  function openMoModal(postId) {
    var post = null;
    for (var i = 0; i < moPosts.length; i++) {
      if (String(moPosts[i].id) === String(postId)) { post = moPosts[i]; break; }
    }
    if (!post) { return; }
    moCurrentPostId = post.id;
    document.getElementById('moModalTitle').textContent = post.title;
    document.getElementById('moModalContent').textContent = post.content;
    refreshLikeCount(post.id, { querySelector: function () { return document.getElementById('moModalLikeCount'); } });
    document.getElementById('moModalOverlay').classList.add('is-open');
    loadMoComments(post.id);
  }

  async function loadMoComments(postId) {
    var listEl = document.getElementById('moModalCommentsList');
    await loadComments(postId, listEl);
  }

  document.getElementById('moGrid').addEventListener('click', function (e) {
    var cell = e.target.closest('[data-post-id]');
    if (cell) { openMoModal(cell.dataset.postId); }
  });
  document.getElementById('moReelsStrip').addEventListener('click', function (e) {
    var card = e.target.closest('[data-post-id]');
    if (card) { openMoModal(card.dataset.postId); }
  });
  document.getElementById('moModalClose').addEventListener('click', function () {
    document.getElementById('moModalOverlay').classList.remove('is-open');
    moCurrentPostId = null;
  });
  document.getElementById('moModalOverlay').addEventListener('click', function (e) {
    if (e.target === this) { this.classList.remove('is-open'); moCurrentPostId = null; }
  });
  document.getElementById('moModalLike').addEventListener('click', async function () {
    if (!currentUser) { alert('Sign in to like posts.'); return; }
    if (!moCurrentPostId) { return; }
    await toggleLike(moCurrentPostId, { querySelector: function () { return document.getElementById('moModalLikeCount'); } }, currentUser.id);
  });
  document.getElementById('moModalSave').addEventListener('click', async function () {
    if (!currentUser) { alert('Sign in to save posts.'); return; }
    if (!moCurrentPostId) { return; }
    var btn = this;
    var existing = await sb.from('saves').select('id').eq('post_id', moCurrentPostId).eq('user_id', currentUser.id);
    if (existing.data && existing.data.length > 0) {
      await sb.from('saves').delete().eq('post_id', moCurrentPostId).eq('user_id', currentUser.id);
      btn.textContent = 'Save';
    } else {
      await sb.from('saves').insert({ post_id: moCurrentPostId, user_id: currentUser.id });
      btn.textContent = 'Saved';
    }
  });
  document.getElementById('moModalCommentInput').addEventListener('keypress', async function (e) {
    if (e.key === 'Enter') {
      if (!currentUser) { alert('Sign in to comment.'); return; }
      if (!moCurrentPostId) { return; }
      var content = this.value.trim();
      if (!content) { return; }
      var uname = currentUser.email;
      if (currentUser.user_metadata && currentUser.user_metadata.username) {
        uname = currentUser.user_metadata.username;
      }
      await sb.from('comments').insert({ post_id: moCurrentPostId, user_id: currentUser.id, author_username: uname, content: content });
      this.value = '';
      loadMoComments(moCurrentPostId);
    }
  });

  document.getElementById('feedSearch').addEventListener('input', function () {
    var query = this.value.toLowerCase();
    var items = document.querySelectorAll('#postsList article');
    for (var i = 0; i < items.length; i++) {
      var text = items[i].textContent.toLowerCase();
      if (text.indexOf(query) === -1) {
        items[i].style.display = 'none';
      } else {
        items[i].style.display = 'block';
      }
    }
  });

  async function refreshLikeCount(postId, btnEl) {
    var result = await sb.from('likes').select('id').eq('post_id', postId);
    var count = 0;
    if (result.data) { count = result.data.length; }
    var span = btnEl.querySelector('.likeCount');
    if (span) { span.textContent = count; }
  }

  async function toggleLike(postId, btnEl, userId) {
    var existing = await sb.from('likes').select('id').eq('post_id', postId).eq('user_id', userId);
    if (existing.data && existing.data.length > 0) {
      await sb.from('likes').delete().eq('post_id', postId).eq('user_id', userId);
    } else {
      await sb.from('likes').insert({ post_id: postId, user_id: userId });
    }
    refreshLikeCount(postId, btnEl);
  }

  async function toggleSave(postId, btnEl, userId) {
    var existing = await sb.from('saves').select('id').eq('post_id', postId).eq('user_id', userId);
    if (existing.data && existing.data.length > 0) {
      await sb.from('saves').delete().eq('post_id', postId).eq('user_id', userId);
      btnEl.textContent = 'Save';
    } else {
      await sb.from('saves').insert({ post_id: postId, user_id: userId });
      btnEl.textContent = 'Saved';
    }
  }

  async function loadComments(postId, listEl) {
    var result = await sb.from('comments').select('*').eq('post_id', postId).order('created_at', { ascending: true });
    var comments = result.data;
    if (!comments) { comments = []; }
    var html = '';
    for (var i = 0; i < comments.length; i++) {
      html += '<p style="color: var(--paper-dim); font-size: 0.85rem; margin-top: 6px;"><strong style="color: var(--brass);">' + escapeHtml(comments[i].author_username) + '</strong>: ' + escapeHtml(comments[i].content) + '</p>';
    }
    listEl.innerHTML = html;
  }

  function initGalleries() {
    var galleries = document.querySelectorAll('.postGallery');
    for (var g = 0; g < galleries.length; g++) {
      wireOneGallery(galleries[g]);
    }
  }

  function wireOneGallery(gallery) {
    var track = gallery.querySelector('.galleryTrack');
    var dots = gallery.querySelectorAll('.galleryDot');
    var prevBtn = gallery.querySelector('.galleryPrev');
    var nextBtn = gallery.querySelector('.galleryNext');

    function updateDots() {
      if (dots.length === 0) { return; }
      var index = Math.round(track.scrollLeft / track.clientWidth);
      for (var i = 0; i < dots.length; i++) {
        dots[i].style.background = (i === index) ? 'rgba(255,255,255,0.9)' : 'rgba(255,255,255,0.4)';
      }
    }

    track.addEventListener('scroll', updateDots);

    if (prevBtn) {
      prevBtn.addEventListener('click', function (e) {
        e.stopPropagation();
        track.scrollBy({ left: -track.clientWidth, behavior: 'smooth' });
      });
    }
    if (nextBtn) {
      nextBtn.addEventListener('click', function (e) {
        e.stopPropagation();
        track.scrollBy({ left: track.clientWidth, behavior: 'smooth' });
      });
    }
  }

  async function wireUpPostInteractions() {
    var userResult = await sb.auth.getUser();
    currentUser = userResult.data.user;
    initGalleries();
    var likeButtons = document.querySelectorAll('.likeBtn');
    for (var i = 0; i < likeButtons.length; i++) {
      var btn = likeButtons[i];
      var pid = btn.getAttribute('data-post-id');
      refreshLikeCount(pid, btn);
      btn.addEventListener('click', function () {
        if (!currentUser) { alert('Sign in to like posts.'); return; }
        toggleLike(this.getAttribute('data-post-id'), this, currentUser.id);
      });
    }

    var saveButtons = document.querySelectorAll('.saveBtn');
    for (var j = 0; j < saveButtons.length; j++) {
      var sbtn = saveButtons[j];
      sbtn.addEventListener('click', function () {
        if (!currentUser) { alert('Sign in to save posts.'); return; }
        toggleSave(this.getAttribute('data-post-id'), this, currentUser.id);
      });
    }

    var toggleButtons = document.querySelectorAll('.toggleCommentsBtn');
    for (var k = 0; k < toggleButtons.length; k++) {
      var tbtn = toggleButtons[k];
      tbtn.addEventListener('click', function () {
        var pid = this.getAttribute('data-post-id');
        var section = document.querySelector('.commentsSection[data-post-id="' + pid + '"]');
        if (section.style.display === 'none') {
          section.style.display = 'block';
          var listEl = section.querySelector('.commentsList');
          loadComments(pid, listEl);
        } else {
          section.style.display = 'none';
        }
      });
    }

    var commentInputs = document.querySelectorAll('.commentInput');
    for (var m = 0; m < commentInputs.length; m++) {
      var input = commentInputs[m];
      input.addEventListener('keypress', async function (e) {
        if (e.key === 'Enter') {
          if (!currentUser) { alert('Sign in to comment.'); return; }
          var pid = this.getAttribute('data-post-id');
          var content = this.value.trim();
          if (!content) { return; }
          var username = currentUser.email;
          if (currentUser.user_metadata && currentUser.user_metadata.username) {
            username = currentUser.user_metadata.username;
          }
          await sb.from('comments').insert({
            post_id: pid,
            user_id: currentUser.id,
            author_username: username,
            content: content
          });
          this.value = '';
          var section = document.querySelector('.commentsSection[data-post-id="' + pid + '"]');
          var listEl = section.querySelector('.commentsList');
          loadComments(pid, listEl);
        }
      });
    }
  }

  async function showAuthStatus() {
    var authStatus = document.getElementById('authStatus');
    var result = await sb.auth.getUser();
    var user = result.data.user;
    if (user) {
      var username = user.email;
      if (user.user_metadata && user.user_metadata.username) {
        username = user.user_metadata.username;
      }
      authStatus.innerHTML = 'Signed in as <strong style="color: var(--brass);">' + username + '</strong> &middot; <a href="#" id="logoutBtn" style="color: var(--brass);">Log out</a>';
      document.getElementById('messagesNavLink').style.display = 'inline-flex';
      document.getElementById('logoutBtn').addEventListener('click', async function (e) {
        e.preventDefault();
        await sb.auth.signOut();
        window.location.reload();
      });
    } else {
      authStatus.innerHTML = '<a href="account.html" style="color: var(--brass);">Sign in</a>';
      document.getElementById('messagesNavLink').style.display = 'none';
    }
  }

  document.getElementById('sortNewest').addEventListener('click', function () {
    window.currentAscending = false;
    this.style.background = 'var(--brass)';
    this.style.color = 'var(--ink)';
    this.style.border = 'none';
    var o = document.getElementById('sortOldest');
    o.style.background = 'none';
    o.style.color = 'var(--brass)';
    o.style.border = '1px solid var(--brass)';
    loadPosts();
  });

  document.getElementById('sortOldest').addEventListener('click', function () {
    window.currentAscending = true;
    this.style.background = 'var(--brass)';
    this.style.color = 'var(--ink)';
    this.style.border = 'none';
    var o = document.getElementById('sortNewest');
    o.style.background = 'none';
    o.style.color = 'var(--brass)';
    o.style.border = '1px solid var(--brass)';
    loadPosts();
  });

  var menuBtn = document.getElementById('menuToggleBtn');
  menuBtn.addEventListener('click', function () {
    document.getElementById('sideMenu').classList.add('is-open');
    document.getElementById('sideMenuOverlay').classList.add('is-open');
  });

  function closeSideMenu() {
    document.getElementById('sideMenu').classList.remove('is-open');
    document.getElementById('sideMenuOverlay').classList.remove('is-open');
  }
  document.getElementById('sideMenuClose').addEventListener('click', closeSideMenu);
  document.getElementById('sideMenuOverlay').addEventListener('click', closeSideMenu);

  loadPosts();
  showAuthStatus();
</script>

</body>
</html>
