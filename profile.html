<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="style.css">
<style>
  .profileCard { transition: border-color .2s ease; } .profileCard:hover { border-color: var(--brass-dim) !important; }

  .pf-streak, .pf-toggle-row, .pf-mobile-grid { display: none; }

  @media (max-width: 640px) {
    body { font-family: 'Inter', sans-serif; }

    .pf-head {
      flex-direction: column !important;
      align-items: center !important;
      text-align: center;
      border-bottom: none !important;
      padding-bottom: 6px !important;
    }
    .pf-avatar { width: 78px !important; height: 78px !important; margin: 0 auto 4px !important; }
    .pf-name { font-size: 1.35rem !important; margin-top: 8px !important; }
    #profileHandle { font-family: 'JetBrains Mono', monospace; font-size: 0.72rem; color: var(--dust); margin-top: 3px; }
    .pf-stats { justify-content: center !important; gap: 26px !important; margin-top: 14px !important; }
    .pf-stats span { text-transform: uppercase; letter-spacing: 0.04em; font-family: 'JetBrains Mono', monospace; font-size: 0.62rem !important; }
    .pf-actions { justify-content: center !important; margin-top: 14px !important; }
    .pf-actions a, .pf-actions button { border-radius: 20px !important; font-family: 'JetBrains Mono', monospace !important; font-size: 0.68rem !important; letter-spacing: 0.03em; }
    .pf-bio { text-align: center; margin-left: auto !important; margin-right: auto !important; }

    .pf-streak {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 18px 0 0;
      padding: 13px 16px;
      background: var(--ink-raised);
      border: 1px solid var(--ink-line);
      border-radius: 16px;
    }
    .pf-streak svg { width: 22px; height: 22px; color: var(--brass); flex: none; }
    .pf-streak-title { font-size: 0.8rem; font-weight: 600; color: var(--paper); }
    .pf-streak-sub { font-size: 0.68rem; color: var(--dust); margin-top: 1px; }

    .pf-toggle-row { display: flex; gap: 20px; margin-top: 20px; padding-bottom: 0; border-bottom: 1px solid var(--ink-line); overflow-x: auto; }
    .pf-toggle { font-family: 'JetBrains Mono', monospace; font-size: 0.68rem; letter-spacing: 0.03em; color: var(--dust); padding-bottom: 10px; position: relative; background: none; border: none; cursor: pointer; white-space: nowrap; }
    .pf-toggle.on { color: var(--paper); }
    .pf-toggle.on::after { content: ''; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--brass); border-radius: 2px; }

    .pf-mobile-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; margin-top: 2px; padding-bottom: 30px; }
    .pf-cell { aspect-ratio: 1/1; position: relative; overflow: hidden; background: linear-gradient(160deg, var(--brass), var(--ink-raised) 85%); border: none; padding: 0; cursor: pointer; }
    .pf-cell img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .pf-cell span { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: var(--display); font-style: italic; color: rgba(232,223,200,0.9); font-size: 11px; text-align: center; padding: 6px; }
    .pf-empty { grid-column: 1 / -1; padding: 20px; text-align: center; color: var(--dust); font-size: 0.8rem; }

    #postsList { display: none !important; }
  }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="reader.js"></script>
<script>
  var params = new URLSearchParams(window.location.search);
  var username = params.get('username');

  async function resolveUsername() {
    if (username) { return username; }
    var result = await sb.auth.getUser();
    var user = result.data.user;
    if (!user) {
      document.getElementById('profileTitle').textContent = 'Sign in to view your profile';
      return null;
    }
    var myUsername = user.email;
    if (user.user_metadata && user.user_metadata.username) {
      myUsername = user.user_metadata.username;
    }
    username = myUsername;
    history.replaceState(null, '', 'profile.html?username=' + encodeURIComponent(username));
    return username;
  }

  document.getElementById('profileTitle').textContent = username ? username : '';

  function escapeHtml(s) {
    var d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  function formatJoinDate(dateStr) {
    if (!dateStr) { return ''; }
    var d = new Date(dateStr);
    if (isNaN(d.getTime())) { return ''; }
    var months = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
    return 'Joined ' + months[d.getMonth()] + ' ' + d.getFullYear();
  }

  async function loadProfileInfo() {
    var result = await sb.from('profiles').select('*').eq('username', username);
    var rows = result.data;
    var initial = username ? username.charAt(0).toUpperCase() : '?';
    if (rows && rows.length > 0) {
      var profile = rows[0];
      if (profile.bio) {
        document.getElementById('profileBio').textContent = profile.bio;
      }
      if (profile.avatar_url) {
        var img = document.getElementById('profileAvatar');
        img.src = profile.avatar_url;
        img.style.display = 'block';
        document.getElementById('profileAvatarPlaceholder').style.display = 'none';
      } else {
        document.getElementById('profileAvatarPlaceholder').textContent = initial;
      }
      var joined = formatJoinDate(profile.created_at);
      if (joined) {
        document.getElementById('statJoined').textContent = joined;
      }
      document.getElementById('profileHandle').textContent = '@' + username + (joined ? ' \u00B7 ' + joined.replace('Joined ', 'joined ') : '');
    } else {
      document.getElementById('profileAvatarPlaceholder').textContent = initial;
      document.getElementById('profileHandle').textContent = '@' + username;
    }
  }

  document.getElementById('shareProfileBtn').addEventListener('click', async function () {
    var url = window.location.href;
    var label = document.getElementById('shareProfileLabel');

    if (navigator.share) {
      try {
        await navigator.share({ title: username + ' on The Adversaria', url: url });
      } catch (e) {
        // person cancelled the share sheet, do nothing
      }
      return;
    }

    if (navigator.clipboard && navigator.clipboard.writeText) {
      try {
        await navigator.clipboard.writeText(url);
        label.textContent = 'Link copied';
        setTimeout(function () { label.textContent = 'Share'; }, 1500);
      } catch (e) {
        window.prompt('Copy this link:', url);
      }
      return;
    }

    window.prompt('Copy this link:', url);
  });

  var currentUser = null;
  var loadedPosts = [];

  async function checkIsOwnProfile() {
    var result = await sb.auth.getUser();
    var user = result.data.user;
    currentUser = user;
    if (!user) { return; }

    var myUsername = user.email;
    if (user.user_metadata && user.user_metadata.username) {
      myUsername = user.user_metadata.username;
    }

    if (myUsername === username) {
      document.getElementById('editProfileLink').style.display = 'inline-block';
      return;
    }

    var msgBtn = document.getElementById('messageLink');
    msgBtn.style.display = 'inline-block';
    msgBtn.href = 'messages.html?with=' + encodeURIComponent(username);

    var followBtn = document.getElementById('followBtn');
    followBtn.style.display = 'inline-block';

    var existingFollow = await sb.from('follows').select('id').eq('follower_id', user.id).eq('following_username', username);
    var isFollowing = existingFollow.data && existingFollow.data.length > 0;
    followBtn.textContent = isFollowing ? 'Following' : 'Follow';
    followBtn.dataset.following = isFollowing ? 'true' : 'false';

    followBtn.addEventListener('click', async function () {
      var nowFollowing = followBtn.dataset.following === 'true';
      if (nowFollowing) {
        await sb.from('follows').delete().eq('follower_id', user.id).eq('following_username', username);
        followBtn.textContent = 'Follow';
        followBtn.dataset.following = 'false';
      } else {
        var targetResult = await sb.from('profiles').select('user_id').eq('username', username);
        var followingId = (targetResult.data && targetResult.data.length > 0) ? targetResult.data[0].user_id : null;
        if (!followingId) {
          alert('Could not find that person.');
          return;
        }
        await sb.from('follows').insert({
          follower_id: user.id,
          follower_username: myUsername,
          following_id: followingId,
          following_username: username
        });
        followBtn.textContent = 'Following';
        followBtn.dataset.following = 'true';
      }
      loadFollowCounts();
    });
  }

  async function loadFollowCounts() {
    var followersResult = await sb.from('follows').select('id').eq('following_username', username);
    var followingResult = await sb.from('follows').select('id').eq('follower_username', username);
    document.getElementById('statFollowers').textContent = followersResult.data ? followersResult.data.length : 0;
    document.getElementById('statFollowing').textContent = followingResult.data ? followingResult.data.length : 0;
  }

  function getVideoEmbedUrl(url) {
    if (!url) { return null; }
    var youtubeMatch = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([a-zA-Z0-9_-]{11})/);
    if (youtubeMatch) {
      return 'https://www.youtube.com/embed/' + youtubeMatch[1];
    }
    var vimeoMatch = url.match(/vimeo\.com\/(?:video\/)?(\d+)/);
    if (vimeoMatch) {
      return 'https://player.vimeo.com/video/' + vimeoMatch[1];
    }
    return null;
  }

  function buildCardHtml(p, likeCount) {
    var out = '';
    out += '<div class="profileCard" data-post-id="' + p.id + '" style="border: 1px solid var(--ink-line); border-radius: 8px; overflow: hidden; background: var(--ink-raised); cursor: pointer;">';
    var hasMultiple = p.image_urls && p.image_urls.length > 1;
    var badgeHtml = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" style="position: absolute; top: 8px; right: 8px; filter: drop-shadow(0 1px 2px rgba(0,0,0,0.7));"><rect x="7" y="7" width="14" height="14" rx="2"/><path d="M3 15V5a2 2 0 0 1 2-2h10"/></svg>';
    if (getVideoEmbedUrl(p.video_url)) {
      out += '<div style="aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 14px; background: linear-gradient(135deg, var(--ink), var(--ink-raised)); box-sizing: border-box;">';
      out += '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="var(--brass)" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="M10 8l6 4-6 4z" fill="var(--brass)" stroke="none"/></svg>';
      out += '<span style="font-family: var(--display); font-style: italic; color: var(--brass); font-size: 1rem; text-align: center; line-height: 1.3;">' + escapeHtml(p.title) + '</span>';
      out += '</div>';
    } else if (p.image_url) {
      out += '<div style="aspect-ratio: 1; overflow: hidden; position: relative;"><img src="' + escapeHtml(p.image_url) + '" style="width: 100%; height: 100%; object-fit: cover; display: block;">' + (hasMultiple ? badgeHtml : '') + '</div>';
    } else {
      out += '<div style="aspect-ratio: 1; display: flex; align-items: center; justify-content: center; padding: 18px; background: linear-gradient(135deg, var(--ink), var(--ink-raised)); box-sizing: border-box;">';
      out += '<span style="font-family: var(--display); font-style: italic; color: var(--brass); font-size: 1.15rem; text-align: center; line-height: 1.3;">' + escapeHtml(p.title) + '</span>';
      out += '</div>';
    }
    out += '<div style="padding: 12px 14px;">';
    out += '<h3 style="font-family: var(--display); color: var(--paper); font-size: 1rem; margin: 0;">' + escapeHtml(p.title) + '</h3>';
    out += '<p style="color: var(--paper-dim); font-size: 0.82rem; margin-top: 6px; line-height: 1.5; max-height: 2.6em; overflow: hidden;">' + escapeHtml(p.content) + '</p>';
    out += '<span style="color: var(--dust); font-size: 0.75rem; margin-top: 10px; display: block;">&#9825; ' + likeCount + '</span>';
    out += '</div></div>';
    return out;
  }

  async function refreshModalLikeCount(postId) {
    var result = await sb.from('likes').select('id').eq('post_id', postId);
    var count = 0;
    if (result.data) { count = result.data.length; }
    document.getElementById('postModalLikeCount').textContent = count;
  }

  async function refreshModalSaveState(postId) {
    var saveBtn = document.getElementById('postModalSaveBtn');
    saveBtn.textContent = 'Save';
    if (!currentUser) { return; }
    var existing = await sb.from('saves').select('id').eq('post_id', postId).eq('user_id', currentUser.id);
    if (existing.data && existing.data.length > 0) {
      saveBtn.textContent = 'Saved';
    }
  }

  async function loadModalComments(postId) {
    var listEl = document.getElementById('postModalCommentsList');
    var result = await sb.from('comments').select('*').eq('post_id', postId).order('created_at', { ascending: true });
    var comments = result.data;
    if (!comments) { comments = []; }
    var html = '';
    for (var i = 0; i < comments.length; i++) {
      html += '<p style="color: var(--paper-dim); font-size: 0.85rem; margin-top: 6px;"><strong style="color: var(--brass);">' + escapeHtml(comments[i].author_username) + '</strong>: ' + escapeHtml(comments[i].content) + '</p>';
    }
    listEl.innerHTML = html;
  }

  var currentModalPostId = null;

  function openPostModal(postId) {
    var post = null;
    for (var i = 0; i < loadedPosts.length; i++) {
      if (String(loadedPosts[i].id) === String(postId)) { post = loadedPosts[i]; break; }
    }
    if (!post && pfSavedPosts) {
      for (var s = 0; s < pfSavedPosts.length; s++) {
        if (String(pfSavedPosts[s].id) === String(postId)) { post = pfSavedPosts[s]; break; }
      }
    }
    if (!post) { return; }
    currentModalPostId = post.id;

    var videoWrap = document.getElementById('postModalVideoWrap');
    var videoFrame = document.getElementById('postModalVideoFrame');
    var videoEmbedUrl = getVideoEmbedUrl(post.video_url);

    var images = [];
    if (post.image_urls && post.image_urls.length > 0) {
      images = post.image_urls;
    } else if (post.image_url) {
      images = [post.image_url];
    }

    var imgWrap = document.getElementById('postModalImageWrap');
    var track = document.getElementById('postModalGalleryTrack');
    var prevBtn = document.getElementById('postModalPrev');
    var nextBtn = document.getElementById('postModalNext');

    if (videoEmbedUrl) {
      videoFrame.src = videoEmbedUrl;
      videoWrap.style.display = 'block';
      imgWrap.style.display = 'none';
    } else {
      videoFrame.src = '';
      videoWrap.style.display = 'none';
      var dotsWrap = document.getElementById('postModalDots');

      if (images.length > 0) {
        var trackHtml = '';
        for (var k = 0; k < images.length; k++) {
          trackHtml += '<img src="' + escapeHtml(images[k]) + '" style="flex: none; width: 100%; scroll-snap-align: start; display: block; aspect-ratio: 4 / 3; object-fit: cover;">';
        }
        track.innerHTML = trackHtml;
        track.scrollLeft = 0;

        var showNav = images.length > 1;
        prevBtn.style.display = showNav ? 'flex' : 'none';
        nextBtn.style.display = showNav ? 'flex' : 'none';

        var dotsHtml = '';
        for (var m = 0; m < images.length; m++) {
          dotsHtml += '<span class="modalGalleryDot" style="width: 6px; height: 6px; border-radius: 50%; display: inline-block; background: ' + (m === 0 ? 'rgba(255,255,255,0.9)' : 'rgba(255,255,255,0.4)') + ';"></span>';
        }
        dotsWrap.innerHTML = dotsHtml;
        dotsWrap.style.display = showNav ? 'flex' : 'none';

        imgWrap.style.display = 'block';
      } else {
        imgWrap.style.display = 'none';
      }
    }

    document.getElementById('postModalTitle').textContent = post.title;
    document.getElementById('postModalContent').textContent = post.content;

    refreshModalLikeCount(post.id);
    refreshModalSaveState(post.id);
    loadModalComments(post.id);

    document.getElementById('postModalOverlay').hidden = false;
  }

  document.getElementById('postModalPrev').addEventListener('click', function () {
    var track = document.getElementById('postModalGalleryTrack');
    track.scrollBy({ left: -track.clientWidth, behavior: 'smooth' });
  });
  document.getElementById('postModalNext').addEventListener('click', function () {
    var track = document.getElementById('postModalGalleryTrack');
    track.scrollBy({ left: track.clientWidth, behavior: 'smooth' });
  });
  document.getElementById('postModalGalleryTrack').addEventListener('scroll', function () {
    var track = this;
    var dots = document.querySelectorAll('#postModalDots .modalGalleryDot');
    if (dots.length === 0) { return; }
    var index = Math.round(track.scrollLeft / track.clientWidth);
    for (var i = 0; i < dots.length; i++) {
      dots[i].style.background = (i === index) ? 'rgba(255,255,255,0.9)' : 'rgba(255,255,255,0.4)';
    }
  });

  function closePostModal() {
    document.getElementById('postModalOverlay').hidden = true;
    document.getElementById('postModalVideoFrame').src = '';
    currentModalPostId = null;
  }

  document.getElementById('postsList').addEventListener('click', function (e) {
    var card = e.target.closest('[data-post-id]');
    if (!card) { return; }
    openPostModal(card.getAttribute('data-post-id'));
  });

  document.getElementById('postModalClose').addEventListener('click', closePostModal);
  document.getElementById('postModalOverlay').addEventListener('click', function (e) {
    if (e.target === this) { closePostModal(); }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { closePostModal(); }
  });

  document.getElementById('postModalLikeBtn').addEventListener('click', async function () {
    if (!currentUser) { alert('Sign in to like posts.'); return; }
    if (!currentModalPostId) { return; }
    var existing = await sb.from('likes').select('id').eq('post_id', currentModalPostId).eq('user_id', currentUser.id);
    if (existing.data && existing.data.length > 0) {
      await sb.from('likes').delete().eq('post_id', currentModalPostId).eq('user_id', currentUser.id);
    } else {
      await sb.from('likes').insert({ post_id: currentModalPostId, user_id: currentUser.id });
    }
    refreshModalLikeCount(currentModalPostId);
    loadUserPosts();
  });

  document.getElementById('postModalSaveBtn').addEventListener('click', async function () {
    if (!currentUser) { alert('Sign in to save posts.'); return; }
    if (!currentModalPostId) { return; }
    var btn = this;
    var existing = await sb.from('saves').select('id').eq('post_id', currentModalPostId).eq('user_id', currentUser.id);
    if (existing.data && existing.data.length > 0) {
      await sb.from('saves').delete().eq('post_id', currentModalPostId).eq('user_id', currentUser.id);
      btn.textContent = 'Save';
    } else {
      await sb.from('saves').insert({ post_id: currentModalPostId, user_id: currentUser.id });
      btn.textContent = 'Saved';
    }
  });

  document.getElementById('postModalCommentInput').addEventListener('keypress', async function (e) {
    if (e.key === 'Enter') {
      if (!currentUser) { alert('Sign in to comment.'); return; }
      if (!currentModalPostId) { return; }
      var content = this.value.trim();
      if (!content) { return; }
      var uname = currentUser.email;
      if (currentUser.user_metadata && currentUser.user_metadata.username) {
        uname = currentUser.user_metadata.username;
      }
      await sb.from('comments').insert({
        post_id: currentModalPostId,
        user_id: currentUser.id,
        author_username: uname,
        content: content
      });
      this.value = '';
      loadModalComments(currentModalPostId);
    }
  });

  async function loadUserPosts() {
    var list = document.getElementById('postsList');
    var result = await sb.from('posts').select('*').eq('author_username', username).order('created_at', { ascending: false });
    var posts = result.data;
    var error = result.error;

    if (error) {
      list.innerHTML = '<p style="color: var(--paper-dim); grid-column: 1 / -1;">Could not load posts.</p>';
      return;
    }
    if (!posts || posts.length === 0) {
      list.innerHTML = '<p style="color: var(--paper-dim); grid-column: 1 / -1;">Nothing published yet.</p>';
      document.getElementById('statEntries').textContent = '0';
      renderPfGrid();
      return;
    }

    document.getElementById('statEntries').textContent = posts.length;
    loadedPosts = posts;

    var ids = [];
    for (var i = 0; i < posts.length; i++) {
      ids.push(posts[i].id);
    }

    var likesResult = await sb.from('likes').select('post_id').in('post_id', ids);
    var likeCounts = {};
    if (likesResult.data) {
      for (var j = 0; j < likesResult.data.length; j++) {
        var pid = likesResult.data[j].post_id;
        if (likeCounts[pid]) {
          likeCounts[pid] = likeCounts[pid] + 1;
        } else {
          likeCounts[pid] = 1;
        }
      }
    }

    var html = '';
    for (var k = 0; k < posts.length; k++) {
      var count = likeCounts[posts[k].id] ? likeCounts[posts[k].id] : 0;
      html += buildCardHtml(posts[k], count);
    }
    list.innerHTML = html;
    renderPfGrid();
  }

  /* ---- Mobile: streak strip, toggle row, tile grid ---- */
  var pfPanel = 'posts';
  var pfSavedPosts = null;

  function pfHasMedia(p) {
    return (p.image_urls && p.image_urls.length > 0) || p.image_url || p.video_url;
  }

  function renderPfCells(posts) {
    var grid = document.getElementById('pfMobileGrid');
    if (!posts || posts.length === 0) {
      grid.innerHTML = '<div class="pf-empty">Nothing here yet.</div>';
      return;
    }
    var html = '';
    posts.forEach(function (p) {
      html += '<button type="button" class="pf-cell" data-post-id="' + p.id + '">';
      if (p.image_url) {
        html += '<img src="' + escapeHtml(p.image_url) + '">';
      } else {
        html += '<span>' + escapeHtml(p.title) + '</span>';
      }
      html += '</button>';
    });
    grid.innerHTML = html;
  }

  async function renderPfGrid() {
    var grid = document.getElementById('pfMobileGrid');
    if (pfPanel === 'posts') {
      renderPfCells(loadedPosts);
    } else if (pfPanel === 'moments') {
      renderPfCells(loadedPosts.filter(pfHasMedia));
    } else if (pfPanel === 'shelves') {
      grid.innerHTML = '<div class="pf-empty">Shelves live in the Bookshelf tab.</div>';
    } else if (pfPanel === 'saved') {
      if (!currentUser) {
        grid.innerHTML = '<div class="pf-empty">Sign in to see saved entries.</div>';
        return;
      }
      var myUsernameCheck = currentUser.email;
      if (currentUser.user_metadata && currentUser.user_metadata.username) {
        myUsernameCheck = currentUser.user_metadata.username;
      }
      if (myUsernameCheck !== username) {
        grid.innerHTML = '<div class="pf-empty">Saved entries are private.</div>';
        return;
      }
      if (pfSavedPosts === null) {
        var savesResult = await sb.from('saves').select('post_id').eq('user_id', currentUser.id);
        var ids = (savesResult.data || []).map(function (s) { return s.post_id; });
        if (ids.length === 0) {
          pfSavedPosts = [];
        } else {
          var postsResult = await sb.from('posts').select('*').in('id', ids);
          pfSavedPosts = postsResult.data || [];
        }
      }
      renderPfCells(pfSavedPosts);
    }
  }

  document.querySelectorAll('.pf-toggle').forEach(function (btn) {
    btn.addEventListener('click', function () {
      document.querySelectorAll('.pf-toggle').forEach(function (b) { b.classList.remove('on'); });
      this.classList.add('on');
      pfPanel = this.dataset.panel;
      renderPfGrid();
    });
  });

  document.getElementById('pfMobileGrid').addEventListener('click', function (e) {
    var cell = e.target.closest('[data-post-id]');
    if (cell) { openPostModal(cell.dataset.postId); }
  });

  function computeStreak() {
    var days = {};
    try {
      var bookmarks = JSON.parse(localStorage.getItem('marg:bookmarks') || '[]');
      bookmarks.forEach(function (b) { if (b.ts) { days[new Date(b.ts).toDateString()] = true; } });
    } catch (e) {}
    ['marg:hl:ms014-ch19'].forEach(function (key) {
      try {
        var hls = JSON.parse(localStorage.getItem(key) || '[]');
        hls.forEach(function (h) {
          var match = /hl_(\d+)_/.exec(h.id || '');
          if (match) { days[new Date(parseInt(match[1], 10)).toDateString()] = true; }
        });
      } catch (e) {}
    });

    var dayList = Object.keys(days);
    if (dayList.length === 0) { return 0; }

    var today = new Date();
    var streak = 0;
    for (var i = 0; i < 365; i++) {
      var d = new Date(today);
      d.setDate(d.getDate() - i);
      if (days[d.toDateString()]) {
        streak++;
      } else if (i > 0) {
        break;
      } else {
        break;
      }
    }
    return streak;
  }

  function renderStreak() {
    var n = computeStreak();
    if (n === 0) { return; }
    document.getElementById('pfStreakTitle').textContent = n + '-day reading streak';
    document.getElementById('pfStreakSub').textContent = n === 1 ? 'You marked something today' : "You've marked something " + n + ' days running';
  }
  renderStreak();

  async function initProfilePage() {
    var resolved = await resolveUsername();
    if (!resolved) { return; }
    loadProfileInfo();
    checkIsOwnProfile();
    loadFollowCounts();
    loadUserPosts();
  }
  initProfilePage();

  async function showAuthStatus() {
    var authStatus = document.getElementById('authStatus');
    var result = await sb.auth.getUser();
    var user = result.data.user;
    if (user) {
      var uname = user.email;
      if (user.user_metadata && user.user_metadata.username) {
        uname = user.user_metadata.username;
      }
      authStatus.innerHTML = 'Signed in as <strong style="color: var(--brass);">' + uname + '</strong> &middot; <a href="#" id="logoutBtn" style="color: var(--brass);">Log out</a>';
      document.getElementById('messagesNavLink').style.display = 'inline-flex';
      document.getElementById('logoutBtn').addEventListener('click', async function (e) {
        e.preventDefault();
        await sb.auth.signOut();
        window.location.reload();
      });
    } else {
      authStatus.innerHTML = '<a href="account.html" style="color: var(--brass);">Sign in</a>';
      document.getElementById('messagesNavLink').style.display = 'none';
    }
  }
  showAuthStatus();

  var menuBtn = document.getElementById('menuToggleBtn');
  menuBtn.addEventListener('click', function () {
    document.getElementById('sideMenu').classList.add('is-open');
    document.getElementById('sideMenuOverlay').classList.add('is-open');
  });
  function closeSideMenu() {
    document.getElementById('sideMenu').classList.remove('is-open');
    document.getElementById('sideMenuOverlay').classList.remove('is-open');
  }
  document.getElementById('sideMenuClose').addEventListener('click', closeSideMenu);
  document.getElementById('sideMenuOverlay').addEventListener('click', closeSideMenu);
</script>
