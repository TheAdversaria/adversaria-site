<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset Password — Adversaria</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;1,400&family=Source+Serif+4:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
</head>
<body data-page-id="reset-password" data-page-title="Reset Password — Adversaria">

<header class="site-header">
  <div class="shell">
    <a class="wordmark" href="index.html">The <span>Adversaria</span></a>
  </div>
</header>

<main class="shell" style="max-width: 480px; margin: 60px auto; padding: 0 20px;">
  <h1 style="font-family: var(--display); font-style: italic; color: var(--paper); font-size: 1.8rem;">Set a new password</h1>

  <div style="margin-top: 24px;">
    <input id="newPasswordInput" type="password" placeholder="New password" style="width: 100%; padding: 10px; margin-bottom: 10px; background: var(--ink-raised); border: 1px solid var(--ink-line); color: var(--paper); border-radius: 4px;">
    <button id="updatePasswordBtn" style="width: 100%; padding: 10px; background: var(--brass); border: none; color: var(--ink); border-radius: 4px; cursor: pointer;">Update Password</button>
    <p id="statusMsg" style="margin-top: 16px; color: var(--paper-dim);"></p>
  </div>
</main>

<script src="reader.js"></script>
<script>
  document.getElementById('updatePasswordBtn').addEventListener('click', async function () {
    var statusMsg = document.getElementById('statusMsg');
    var newPassword = document.getElementById('newPasswordInput').value;
    if (!newPassword) {
      statusMsg.textContent = 'Please enter a new password.';
      return;
    }
    var result = await sb.auth.updateUser({ password: newPassword });
    if (result.error) {
      statusMsg.textContent = result.error.message;
    } else {
      statusMsg.textContent = 'Password updated. You can now sign in with your new password.';
    }
  });
</script>

</body>
</html>
