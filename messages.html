<script src="reader.js"></script>
<script>
  var currentUser = null;
  var params = new URLSearchParams(window.location.search);
  var withUsername = params.get('with');

  function escapeHtml(s) {
    var d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  function getMyUsername() {
    var myUsername = currentUser.email;
    if (currentUser.user_metadata && currentUser.user_metadata.username) {
      myUsername = currentUser.user_metadata.username;
    }
    return myUsername;
  }

  function formatMessageTime(dateStr) {
    var d = new Date(dateStr);
    if (isNaN(d.getTime())) { return ''; }
    var now = new Date();
    var sameDay = d.toDateString() === now.toDateString();
    if (sameDay) {
      var hours = d.getHours();
      var minutes = d.getMinutes();
      var ampm = hours >= 12 ? 'PM' : 'AM';
      var h12 = hours % 12;
      if (h12 === 0) { h12 = 12; }
      var mm = minutes < 10 ? '0' + minutes : minutes;
      return h12 + ':' + mm + ' ' + ampm;
    }
    var months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    return months[d.getMonth()] + ' ' + d.getDate();
  }

  async function loadInbox() {
    var list = document.getElementById('inboxList');
    var userResult = await sb.auth.getUser();
    currentUser = userResult.data.user;
    if (!currentUser) {
      list.innerHTML = '<p style="color: var(--paper-dim);">Sign in to see your messages.</p>';
      return;
    }

    var sentResult = await sb.from('messages').select('*').eq('sender_id', currentUser.id);
    var receivedResult = await sb.from('messages').select('*').eq('recipient_id', currentUser.id);

    var allMessages = [];
    if (sentResult.data) { allMessages = allMessages.concat(sentResult.data); }
    if (receivedResult.data) { allMessages = allMessages.concat(receivedResult.data); }

    if (allMessages.length === 0) {
      list.innerHTML = '<p style="color: var(--paper-dim);">No correspondence yet. Message someone from their profile to start one.</p>';
      return;
    }

    allMessages.sort(function (a, b) {
      return new Date(b.created_at) - new Date(a.created_at);
    });

    var conversations = {};
    var order = [];
    for (var i = 0; i < allMessages.length; i++) {
      var m = allMessages[i];
      var otherUsername = (m.sender_id === currentUser.id) ? m.recipient_username : m.sender_username;
      if (!conversations[otherUsername]) {
        conversations[otherUsername] = m;
        order.push(otherUsername);
      }
    }

    var html = '';
    for (var j = 0; j < order.length; j++) {
      var uname = order[j];
      var last = conversations[uname];
      var prefix = (last.sender_id === currentUser.id) ? 'You: ' : '';
      html += '<a href="messages.html?with=' + encodeURIComponent(uname) + '" style="display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 16px 0; border-bottom: 1px solid var(--ink-line); text-decoration: none;">';
      html += '<span>';
      html += '<strong style="color: var(--paper); font-family: var(--display); font-style: italic; font-size: 1.05rem;">' + escapeHtml(uname) + '</strong>';
      html += '<span style="display: block; color: var(--paper-dim); font-size: 0.85rem; margin-top: 3px; max-width: 46ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">' + escapeHtml(prefix + last.content) + '</span>';
      html += '</span>';
      html += '<span style="color: var(--dust); font-size: 0.75rem; white-space: nowrap;">' + formatMessageTime(last.created_at) + '</span>';
      html += '</a>';
    }
    list.innerHTML = html;
  }

  function buildBubbleHtml(m, isMine) {
    var align = isMine ? 'flex-end' : 'flex-start';
    var bg = isMine ? 'var(--brass)' : 'var(--ink-raised)';
    var color = isMine ? 'var(--ink)' : 'var(--paper)';
    var out = '<div style="display: flex; justify-content: ' + align + '; margin-bottom: 10px;">';
    out += '<div style="max-width: 72%; background: ' + bg + '; color: ' + color + '; padding: 9px 14px; border-radius: 14px; white-space: pre-wrap; word-wrap: break-word; font-size: 0.92rem; line-height: 1.45;">';
    out += escapeHtml(m.content);
    out += '</div></div>';
    return out;
  }

  function scrollThreadToBottom() {
    var area = document.getElementById('threadArea');
    area.scrollTop = area.scrollHeight;
  }

  async function loadConversation(isInitialLoad) {
    var threadArea = document.getElementById('threadArea');
    if (!currentUser) { return; }

    var sentResult = await sb.from('messages').select('*').eq('sender_id', currentUser.id).eq('recipient_username', withUsername).order('created_at', { ascending: true });
    var receivedResult = await sb.from('messages').select('*').eq('recipient_id', currentUser.id).eq('sender_username', withUsername).order('created_at', { ascending: true });

    var thread = [];
    if (sentResult.data) { thread = thread.concat(sentResult.data); }
    if (receivedResult.data) { thread = thread.concat(receivedResult.data); }
    thread.sort(function (a, b) {
      return new Date(a.created_at) - new Date(b.created_at);
    });

    if (thread.length === 0) {
      threadArea.innerHTML = '<p style="color: var(--paper-dim); font-size: 0.9rem;">Nothing here yet — send the first message.</p>';
      return;
    }

    var html = '';
    for (var i = 0; i < thread.length; i++) {
      html += buildBubbleHtml(thread[i], thread[i].sender_id === currentUser.id);
    }
    threadArea.innerHTML = html;
    if (isInitialLoad) {
      scrollThreadToBottom();
    }
  }

  async function checkMessagingLimit() {
    var profileResult = await sb.from('profiles').select('is_premium').eq('user_id', currentUser.id);
    var isPremium = profileResult.data && profileResult.data.length > 0 && profileResult.data[0].is_premium;
    if (isPremium) { return true; }

    var countResult = await sb.from('messages').select('id').eq('sender_id', currentUser.id);
    var sentCount = countResult.data ? countResult.data.length : 0;
    return sentCount < 5;
  }

  async function refreshComposerState() {
    var canSend = await checkMessagingLimit();
    document.getElementById('composerRow').style.display = canSend ? 'flex' : 'none';
    document.getElementById('upgradePrompt').style.display = canSend ? 'none' : 'block';
    return canSend;
  }

  async function sendMessage() {
    var input = document.getElementById('messageInput');
    var content = input.value.trim();
    if (!content || !currentUser) { return; }

    var recipientResult = await sb.from('profiles').select('user_id').eq('username', withUsername);
    if (!recipientResult.data || recipientResult.data.length === 0) {
      alert('Could not find that person.');
      return;
    }
    var recipientId = recipientResult.data[0].user_id;

    var result = await sb.from('messages').insert({
      sender_id: currentUser.id,
      sender_username: getMyUsername(),
      recipient_id: recipientId,
      recipient_username: withUsername,
      content: content
    });

    if (result.error) {
      refreshComposerState();
      alert('Could not send that message. If you have sent your 5 free messages, that is expected — see the note below the message box.');
      return;
    }
    input.value = '';
    loadConversation(true);
    refreshComposerState();
  }

  async function initPage() {
    var userResult = await sb.auth.getUser();
    currentUser = userResult.data.user;

    if (withUsername) {
      document.getElementById('inboxView').style.display = 'none';
      document.getElementById('conversationView').style.display = 'block';
      document.getElementById('conversationTitle').textContent = withUsername;

      if (!currentUser) {
        document.getElementById('threadArea').innerHTML = '<p style="color: var(--paper-dim);">Sign in to view this conversation.</p>';
        return;
      }

      loadConversation(true);
      refreshComposerState();
      setInterval(function () { loadConversation(false); }, 4000);

      document.getElementById('sendBtn').addEventListener('click', sendMessage);
      document.getElementById('messageInput').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') { sendMessage(); }
      });
    } else {
      loadInbox();
    }
  }
  initPage();

  async function showAuthStatus() {
    var authStatus = document.getElementById('authStatus');
    var result = await sb.auth.getUser();
    var user = result.data.user;
    if (user) {
      var username = user.email;
      if (user.user_metadata && user.user_metadata.username) {
        username = user.user_metadata.username;
      }
      authStatus.innerHTML = 'Signed in as <strong style="color: var(--brass);">' + username + '</strong> &middot; <a href="#" id="logoutBtn" style="color: var(--brass);">Log out</a>';
      document.getElementById('logoutBtn').addEventListener('click', async function (e) {
        e.preventDefault();
        await sb.auth.signOut();
        window.location.reload();
      });
    } else {
      authStatus.innerHTML = '<a href="account.html" style="color: var(--brass);">Sign in</a>';
    }
  }
  showAuthStatus();

  var menuBtn = document.getElementById('menuToggleBtn');
  menuBtn.addEventListener('click', function () {
    document.getElementById('sideMenu').classList.add('is-open');
    document.getElementById('sideMenuOverlay').classList.add('is-open');
  });
  function closeSideMenu() {
    document.getElementById('sideMenu').classList.remove('is-open');
    document.getElementById('sideMenuOverlay').classList.remove('is-open');
  }
  document.getElementById('sideMenuClose').addEventListener('click', closeSideMenu);
  document.getElementById('sideMenuOverlay').addEventListener('click', closeSideMenu);
</script>

</body>
