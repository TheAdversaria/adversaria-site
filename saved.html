<script src="reader.js"></script>
<script>
  function escapeHtml(s) {
    var d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  async function loadSaved() {
    var list = document.getElementById('savedList');
    var userResult = await sb.auth.getUser();
    var user = userResult.data.user;
    if (!user) {
      list.innerHTML = '<p style="color: var(--paper-dim);">Sign in to see your saved entries.</p>';
      return;
    }
    var savesResult = await sb.from('saves').select('post_id').eq('user_id', user.id);
    var saves = savesResult.data;
    if (!saves || saves.length === 0) {
      list.innerHTML = '<p style="color: var(--paper-dim);">Nothing saved yet.</p>';
      return;
    }
    var ids = [];
    for (var i = 0; i < saves.length; i++) {
      ids.push(saves[i].post_id);
    }
    var postsResult = await sb.from('posts').select('*').in('id', ids);
    var posts = postsResult.data;
    if (!posts || posts.length === 0) {
      list.innerHTML = '<p style="color: var(--paper-dim);">Nothing saved yet.</p>';
      return;
    }
    var html = '';
    for (var j = 0; j < posts.length; j++) {
      var p = posts[j];
      html += '<article style="border-bottom: 1px solid var(--ink-line); padding: 20px 0;">';
      html += '<h2 style="font-family: var(--display); color: var(--paper); font-size: 1.3rem;">' + escapeHtml(p.title) + '</h2>';
      html += '<a href="profile.html?username=' + encodeURIComponent(p.author_username) + '" style="color: var(--brass); font-size: 0.85rem;">by ' + escapeHtml(p.author_username) + '</a>';
      html += '<p style="color: var(--paper-dim); margin-top: 10px; white-space: pre-wrap;">' + escapeHtml(p.content) + '</p>';
      html += '</article>';
    }
    list.innerHTML = html;
  }

  async function showAuthStatus() {
    var authStatus = document.getElementById('authStatus');
    var result = await sb.auth.getUser();
    var user = result.data.user;
if (user) {
      var username = user.email;
      if (user.user_metadata && user.user_metadata.username) {
        username = user.user_metadata.username;
      }
      authStatus.innerHTML = 'Signed in as <strong style="color: var(--brass);">' + username + '</strong> &middot; <a href="#" id="logoutBtn" style="color: var(--brass);">Log out</a>';
      document.getElementById('messagesNavLink').style.display = 'inline-flex';
      document.getElementById('logoutBtn').addEventListener('click', async function (e) {
        e.preventDefault();
        await sb.auth.signOut();
        window.location.reload();
      });
    } else {
      authStatus.innerHTML = '<a href="account.html" style="color: var(--brass);">Sign in</a>';
      document.getElementById('messagesNavLink').style.display = 'none';
    }
  }

  var menuBtn = document.getElementById('menuToggleBtn');
  menuBtn.addEventListener('click', function () {
    document.getElementById('sideMenu').classList.add('is-open');
    document.getElementById('sideMenuOverlay').classList.add('is-open');
  });
  function closeSideMenu() {
    document.getElementById('sideMenu').classList.remove('is-open');
    document.getElementById('sideMenuOverlay').classList.remove('is-open');
  }
  document.getElementById('sideMenuClose').addEventListener('click', closeSideMenu);
  document.getElementById('sideMenuOverlay').addEventListener('click', closeSideMenu);

  loadSaved();
  showAuthStatus();
</script>
